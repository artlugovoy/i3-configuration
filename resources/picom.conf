# Backend
backend = "glx";
vsync = true;
xrender-sync-fence = true;
use-damage = true;

# Shadow
shadow = true;
shadow-radius = 5;
shadow-opacity = 0.6;
shadow-offset-x = -5;
shadow-offset-y = -5;
shadow-color = "#000000";
crop-shadow-to-monitor = true;

# Fading
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;
no-fading-openclose = false;
no-fading-destroyed-argb = false;

# Blur settings
blur: {
  method = "dual_kawase";
  strength = 5;
  deviation = 1.0;
  kernel = "11x11gaussian";
  background = false;
  background-frame = false;
  background-fixed = false;
};

# General settings
daemon = false;
experimental-backends = true;
dbus = false;
detect-rounded-corners = true;
detect-client-opacity = true;
use-ewmh-active-win = false;
unredir-if-possible = true;
unredir-if-possible-delay = 0;
detect-transient = true;
detect-client-leader = true;
glx-fshader-win = "";
force-win-blend = false;
no-ewmh-fullscreen = false;
max-brightness = 1.0;
transparent-clipping = false;

# Animations
@include "picom-animations-test.conf"


# Window rules
rules: (
  {
    match = "window_type = 'normal'";
    blur-background = true;
    fade = true;
    shadow = true;
  },

  {
    match = "fullscreen";
    corner-radius = 0;
    blur-background = false;
  },

  {
    match = "class_g = 'Alacritty' || class_g = 'st-256color' || class_g = 'kitty' || class_g = 'FloaTerm'";
    opacity = 1.0;
    blur-background = false;
  },

  {
    match = "class_g = 'Polybar' || class_g = 'eww-bar' || class_g = 'Dunst'";
    corner-radius = 0;
    shadow = false;
  },

  {
    match = "class_g = 'Conky'";
    shadow = false;
    corner-radius = 0;
    blur-background = false;
  },

  {
    match = "class_g = 'mpv' || class_g = 'vlc'";
    corner-radius = 0;
    unredir-if-possible = true;
  },

  {
    match = "class_g = 'Rofi'";
    corner-radius = 0;
    blur-background = true;
  },

  {
    match = "class_g = 'Firefox' || class_g = 'Chrome' || class_g = 'Chromium'";
    shadow = false;
  },

  {
    match = "window_type = 'menu' || role = 'popup' || role = 'bubble'";
    shadow = false;
    corner-radius = 0;
  },

  {
    match = "name = 'Notification' || class_g ?= 'Notify-osd' || _GTK_FRAME_EXTENTS@";
    shadow = false;
    corner-radius = 0;
  }
);
